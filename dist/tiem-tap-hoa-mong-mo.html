<title>Tiệm Tạp Hóa Mộng Mơ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap&subset=vietnamese">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #2b211b; font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive; color: #3b2a20; user-select: none; -webkit-user-select: none; }
#stage { --ox: 0px; --s: 1; position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
#game { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }

button { font-family: inherit; cursor: pointer; color: inherit; }
b { font-weight: bold; }
.green { color: #2e7d4a; }
.red { color: #c0392b; }
.muted { color: #8a7a66; }
.stars { color: #f0a500; letter-spacing: 1px; text-shadow: 0 1px 0 #7a4a00; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: 0; left: 0; right: 0; height: 42px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 0 calc(10px + env(safe-area-inset-right, 0px) / var(--s)) 0 calc(10px + env(safe-area-inset-left, 0px) / var(--s));
  background: linear-gradient(rgba(59,42,32,.92), rgba(59,42,32,.7)); border-bottom: 2px solid rgba(0,0,0,.25); }
.hgroup { display: flex; gap: 6px; align-items: center; }
.chip { background: #fff8e6; border: 2px solid #3b2a20; border-radius: 16px; padding: 2px 12px; font-size: 18px; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.chip.money { background: #e8f7e0; font-weight: bold; }
.chip.money.neg { background: #ffe0dc; color: #c0392b; }
.chip.debt { background: #e3ecfa; color: #2a5a9c; }
.chip.late { background: #ffe1c4; color: #b04a00; }
.hbtn { background: #ffd66b; border: 2px solid #3b2a20; border-radius: 10px; padding: 3px 10px; font-size: 17px; box-shadow: 0 3px 0 #3b2a20; transition: transform .08s; }
.hbtn:hover { background: #ffe08f; }
.hbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #3b2a20; }
.hbtn.sm { padding: 3px 8px; min-width: 38px; }
.hbtn.off { background: #c9bda6; text-decoration: line-through; opacity: .75; }

/* xác nhận & vắng mặt */
.ask p { font-size: 22px; text-align: center; margin: 14px 6px 4px; line-height: 1.3; }
.offline { display: flex; flex-direction: column; align-items: center; text-align: center; }
.off-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 6px 0; }
.off-it { display: flex; align-items: center; gap: 2px; background: #fff; border: 2px solid #e0c99a; border-radius: 10px; padding: 2px 8px 2px 4px; font-size: 18px; }
.off-it .ic { width: 30px; height: 40px; }
.off-line { font-size: 19px; margin: 2px 0; }
.off-total { font-size: 44px; font-weight: bold; color: #2e7d4a; margin: 6px 0; text-shadow: 0 2px 0 #fff, 0 3px 0 rgba(0,0,0,.15); }
.off-warn { font-size: 18px; color: #b04a00; background: #ffeedd; border-radius: 10px; padding: 6px 12px; }

/* ---------- thanh hành động ---------- */
#bar { position: absolute; left: calc(var(--ox) + 292px); right: calc(10px + env(safe-area-inset-right, 0px) / var(--s)); bottom: calc(8px + env(safe-area-inset-bottom, 0px) / var(--s)); height: 100px; display: flex; align-items: center; gap: 12px; padding: 8px 12px;
  background: rgba(255,248,230,.96); border: 3px solid #3b2a20; border-radius: 16px; box-shadow: 0 5px 0 rgba(59,42,32,.5); }
#bar:empty { display: none; }
.bar-msg { flex: 1; font-size: 21px; padding-left: 6px; }
.bag { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.bag-label { font-size: 15px; color: #8a6a3a; }
.bag-items { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; align-items: center; min-height: 58px; }
.hint { color: #8a7a66; font-size: 18px; }
.chipitem { display: flex; align-items: center; gap: 2px; background: #fff; border: 2px solid #c9a96a; border-radius: 10px; padding: 2px 8px 2px 4px; font-size: 18px; flex-shrink: 0; }
.chipitem:hover { border-color: #c0392b; background: #ffeeee; }
.chipitem .ic { width: 34px; height: 45px; }
.total { display: flex; flex-direction: column; align-items: center; min-width: 110px; background: #2f3b4a; color: #c9e0a8; border-radius: 10px; padding: 4px 10px; border: 2px solid #3b2a20; }
.total small { font-size: 13px; color: #a9b8c4; }
.total b { font-size: 22px; font-family: monospace; }
.acts { display: flex; gap: 8px; align-items: center; }
.btn { border: 2.5px solid #3b2a20; border-radius: 12px; padding: 8px 14px; font-size: 19px; background: #fff; box-shadow: 0 4px 0 #3b2a20; transition: transform .08s; white-space: nowrap; }
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 #3b2a20; }
.btn.go { background: #5fbf6b; color: #fff; text-shadow: 0 1px 0 #2a6a33; }
.btn.go:hover { background: #6fd07b; }
.btn.ghost { background: #fff3d6; }
.btn.ghost:hover { background: #ffe9b8; }
.btn small { font-size: 13px; opacity: .85; }
.btn.sm { padding: 3px 10px; font-size: 16px; box-shadow: 0 3px 0 #3b2a20; }
.btn.big { font-size: 24px; padding: 10px 26px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- thối tiền ---------- */
#change { position: absolute; right: calc(14px + env(safe-area-inset-right, 0px) / var(--s)); top: 52px; width: 420px; background: #fff8e6; border: 3px solid #3b2a20; border-radius: 16px; padding: 12px 14px;
  box-shadow: 0 6px 0 rgba(59,42,32,.55); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
#change.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.ch-head { font-size: 26px; font-weight: bold; color: #8a3a1a; }
.ch-row { display: flex; justify-content: space-between; font-size: 20px; border-bottom: 1px dashed #d9c49a; padding: 2px 0; }
.ch-row b { font-family: monospace; font-size: 20px; }
.ch-row.need b { color: #c0392b; }
.ch-sub { font-size: 15px; color: #8a6a3a; }
.ch-bills, .ch-tray, .ch-drawer { display: flex; flex-wrap: wrap; gap: 5px; }
.ch-tray { min-height: 44px; background: #f3e6c8; border-radius: 10px; padding: 5px; border: 2px dashed #c9a96a; align-items: center; }
.ch-drawer { background: #6b4a2b; padding: 8px; border-radius: 10px; border: 2px solid #3b2a20; }
.ch-acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.bill { position: relative; width: 84px; height: 40px; border-radius: 5px; border: 2px solid #3b2a20; background: var(--c);
  background-image: linear-gradient(90deg, rgba(255,255,255,.0) 0 64%, rgba(255,255,255,.35) 64% 66%, rgba(255,255,255,0) 66%), radial-gradient(circle at 24% 50%, rgba(255,255,255,.45) 0 9px, transparent 10px);
  box-shadow: 0 2px 0 #3b2a20; font-size: 18px; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000, 0 1px 0 #000; }
.bill span { position: relative; left: 10px; }
.bill:hover:not([disabled]) { transform: translateY(-2px); }
.bill[disabled] { cursor: default; opacity: 1; }
.ch-bills .bill, .ch-tray .bill { width: 70px; height: 34px; font-size: 16px; }

/* ---------- modal ---------- */
#modal-bg { position: absolute; inset: 0; background: rgba(30,20,10,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
#modal { position: relative; width: 600px; max-height: 680px; background: #fff8e6; border: 4px solid #3b2a20; border-radius: 20px; padding: 18px 24px; box-shadow: 0 8px 0 rgba(0,0,0,.4);
  display: flex; flex-direction: column; animation: pop .18s ease-out; }
#modal.wide { width: 1080px; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
#modal h2 { font-size: 32px; color: #8a3a1a; margin-bottom: 4px; }
#modal h3 { font-size: 20px; color: #6b4a22; margin: 10px 0 4px; border-bottom: 2px dashed #d9c49a; }
.m-sub { font-size: 18px; color: #6b5a46; margin: 4px 0 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.m-acts { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.m-acts.col { flex-direction: column; align-items: center; }
.mclose { position: absolute; right: 12px; top: 10px; width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid #3b2a20; background: #ff8a7a; font-size: 20px; color: #fff; box-shadow: 0 3px 0 #3b2a20; }

/* nhập hàng */
.rs-scroll { overflow-y: auto; max-height: 540px; padding-right: 6px; }
.rs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rs-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid #e0c99a; border-radius: 12px; padding: 4px 8px; }
.rs-item.low { border-color: #e0453a; background: #fff3f1; }
.rs-item.locked { opacity: .45; }
.rs-ic { width: 40px; height: 53px; flex-shrink: 0; }
.rs-info { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 17px; line-height: 1.1; }
.rs-info small { font-size: 13px; color: #8a7a66; }
.rs-stock { position: relative; height: 14px; background: #eee; border-radius: 7px; margin-top: 3px; overflow: hidden; border: 1px solid #c9b48a; }
.rs-stock div { height: 100%; background: #7cc68a; }
.rs-stock span { position: absolute; inset: 0; font-size: 12px; text-align: center; line-height: 13px; }
.rs-btns { display: flex; flex-direction: column; gap: 2px; }
.rs-btns button { border: 2px solid #3b2a20; border-radius: 7px; background: #ffd66b; font-size: 14px; padding: 0 6px; min-width: 42px; }
.rs-btns button:hover { background: #ffe08f; }

/* nâng cấp */
.up-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; max-height: 560px; }
.up { display: flex; gap: 10px; background: #fff; border: 2.5px solid #e0c99a; border-radius: 14px; padding: 10px 12px; }
.up.own { background: #eef8ea; border-color: #9fd3a3; }
.up-info { flex: 1; }
.up-info b { font-size: 21px; }
.up-info p { font-size: 16px; color: #6b5a46; line-height: 1.15; margin-top: 2px; }
.up-items { display: flex; gap: 2px; margin-top: 4px; }
.up-items .ic { width: 26px; height: 34px; }
.up-buy { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 110px; font-size: 19px; }
.owned { color: #2e7d4a; font-weight: bold; }

/* sổ nợ */
.notebook { background: repeating-linear-gradient(#fffdf3 0 29px, #b9cfe8 29px 30px); border-left: 6px double #e08a8a; padding: 6px 12px 6px 18px; border-radius: 6px; }
.debts { width: 100%; border-collapse: collapse; font-size: 20px; margin: 6px 0; }
.debts td { padding: 4px 6px; }
.debts td.r { text-align: right; font-family: monospace; color: #c0392b; font-weight: bold; }
.debts small { color: #8a7a66; font-size: 14px; }
.debts .empty { text-align: center; color: #8a7a66; padding: 18px; }

/* tổng kết */
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; margin: 8px 0; }
.sum-grid > div { display: flex; justify-content: space-between; font-size: 20px; border-bottom: 1px dashed #d9c49a; padding: 3px 0; }
.sum-grid > div b { font-family: monospace; }
.sum-grid .big { grid-column: 1 / -1; font-size: 24px; background: #fff1c9; border-radius: 8px; padding: 4px 10px; border: none; }
.notebook .m-sub { display: block; line-height: 30px; margin: 0; }

/* menu */
.menu { display: flex; flex-direction: column; align-items: center; text-align: center; }
.logo { font-size: 50px; font-weight: bold; line-height: 1; margin-top: 6px; background: #f4e3a1; border: 4px solid #6b4a22; border-radius: 12px; padding: 8px 22px; box-shadow: 0 5px 0 #6b4a22; }
.logo .l1 { color: #1f4fa0; }
.logo .l2 { color: #e0368a; }
.tag { font-size: 19px; color: #6b4a22; margin-top: 10px; }
.portrait { width: 380px; height: 150px; margin: 6px 0; }
.help ol { font-size: 19px; line-height: 1.3; padding-left: 26px; margin: 8px 0; }
.help li { margin: 5px 0; }

/* toast */
#toasts { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none !important; z-index: 20; }
.toast { background: rgba(59,42,32,.94); color: #fff8e6; font-size: 20px; padding: 6px 18px; border-radius: 14px; border: 2px solid #ffd66b; animation: pop .2s; transition: opacity .5s, transform .5s; }
.toast.out { opacity: 0; transform: translateY(-10px); }

/* ---------- điện thoại cầm dọc ---------- */
#rotate { display: none; position: fixed; inset: 0; z-index: 50; background: radial-gradient(circle at 50% 40%, #4a3628, #2b211b); color: #fff8e6; align-items: center; justify-content: center; padding: 24px; }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } body.rot-skip #rotate { display: none; } }
.rot-box { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 340px; }
.rot-box b { font-size: 28px; color: #ffd66b; }
.rot-box span { font-size: 19px; opacity: .9; }
.rot-box .muted { color: #e0cfa8; font-size: 17px; }
.rot-phone { font-size: 84px; animation: rot 2.2s ease-in-out infinite; }
@keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
.rot-skip { background: none; border: none; color: #e0cfa8; text-decoration: underline; font-size: 16px; margin-top: 8px; }
.hbtn.on { background: #9fd3a3; }

/* ---------- chế độ điện thoại: chữ & nút to hơn ---------- */
body.phone #hud { height: 54px; }
body.phone .chip { font-size: 23px; padding: 3px 12px; }
body.phone .hbtn { font-size: 23px; padding: 4px 11px; }
body.phone .hbtn .lbl { display: none; }
body.phone #toasts { top: 62px; }
body.phone .toast { font-size: 25px; }
body.phone #bar { height: 124px; gap: 14px; }
body.phone .bar-msg { font-size: 27px; }
body.phone .bag-label { font-size: 19px; }
body.phone .hint { font-size: 22px; }
body.phone .chipitem { font-size: 24px; }
body.phone .chipitem .ic { width: 44px; height: 58px; }
body.phone .total { min-width: 140px; }
body.phone .total small { font-size: 17px; }
body.phone .total b { font-size: 28px; }
body.phone .btn { font-size: 24px; padding: 12px 16px; }
body.phone .btn small { display: none; }
body.phone #change { top: 62px; width: 500px; gap: 7px; padding: 12px 16px; }
body.phone .ch-head { font-size: 30px; }
body.phone .ch-row, body.phone .ch-row b { font-size: 24px; }
body.phone .ch-sub { font-size: 18px; }
body.phone .bill { width: 108px; height: 50px; font-size: 22px; }
body.phone .ch-bills .bill, body.phone .ch-tray .bill { width: 84px; height: 40px; font-size: 19px; }
body.phone #modal { width: 720px; max-height: 700px; padding: 16px 22px; }
body.phone #modal.wide { width: min(1240px, calc(100% - 40px)); }
body.phone #modal h2 { font-size: 36px; }
body.phone .m-sub { font-size: 21px; }
body.phone .rs-grid { grid-template-columns: repeat(3, 1fr); }
body.phone .rs-info { font-size: 20px; }
body.phone .rs-info small { font-size: 15px; }
body.phone .rs-btns button { font-size: 18px; padding: 3px 8px; min-width: 52px; }
body.phone .rs-scroll, body.phone .up-list { max-height: 560px; }
body.phone .up-info b { font-size: 24px; }
body.phone .up-info p { font-size: 19px; }
body.phone .sum-grid > div { font-size: 23px; }
body.phone .help ol { font-size: 22px; }
body.phone .debts { font-size: 23px; }
body.phone .mclose { width: 50px; height: 50px; font-size: 26px; }

::-webkit-scrollbar { width: 10px; height: 8px; }
::-webkit-scrollbar-thumb { background: #c9a96a; border-radius: 5px; }

</style>
<div id="stage">
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="hud"></div>
      <div id="bar"></div>
      <div id="change" class="hidden"></div>
      <div id="modal-bg" class="hidden"><div id="modal"></div></div>
      <div id="toasts"></div>
    </div>
  </div>
  <div id="rotate">📱 Xoay ngang điện thoại để chơi to hơn</div>
<script>

// ============================================================

const VW = 1280, VH = 720;

};

// icon.k = kiểu hình vẽ (xem ICON_DRAW trong art.js)

// ---- js/music.js ----
'use strict';
// ============================================================
//  NHẠC NỀN — tự tạo bằng WebAudio, không cần file nhạc
//  Âm giai ngũ cung (C D F G A), tiếng gảy kiểu đàn tranh,
//  luyến láy kiểu đàn bầu ở nốt dài, mõ gõ nhịp nhẹ.
// ============================================================
const MUSIC = (() => {
  const BPM = 84, STEP = 60 / BPM / 2;          // nốt móc đơn
  const N = { C3: 48, D3: 50, F3: 53, G3: 55, A3: 57, C4: 60, D4: 62, F4: 65, G4: 67, A4: 69, C5: 72, D5: 74, F5: 77, G5: 79, A5: 81, E4: 64, E3: 52, B3: 59 };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = { F: ['F3', 'A3', 'C4'], C: ['C3', 'G3', 'C4'], Dm: ['D3', 'F3', 'A3'], G: ['G3', 'D4', 'G4'], Am: ['A3', 'C4', 'E4'] };
  const _ = null;
  // mỗi khúc: 8 ô nhịp × 8 phách
  const SONG = [
    { chords: ['F', 'C', 'Dm', 'C', 'F', 'G', 'Am', 'C'], mel: [
      'A4', _, 'C5', _, 'D5', 'C5', 'A4', _,
      'G4', _, _, 'A4', 'G4', 'F4', 'D4', _,
      'F4', _, 'G4', 'A4', _, 'C5', 'A4', _,
      'G4', _, _, _, _, _, _, _,
      'C5', _, 'D5', 'F5', _, 'D5', 'C5', _,
      'D5', _, 'C5', 'A4', _, 'G4', 'A4', _,
      'C5', _, 'A4', 'G4', 'F4', _, 'D4', 'F4',
      'G4', _, _, _, _, _, _, _] },
    { chords: ['Dm', 'C', 'F', 'G', 'Dm', 'Am', 'G', 'C'], mel: [
      'D5', _, 'F5', _, 'D5', 'C5', 'A4', _,
      'C5', _, 'A4', _, 'G4', _, 'A4', _,
      'F4', _, 'G4', 'A4', 'C5', _, 'D5', _,
      'C5', _, 'A4', _, 'G4', _, _, _,
      'A4', _, 'C5', 'D5', _, 'F5', 'D5', _,
      'C5', _, _, 'A4', 'G4', _, 'A4', _,
      'D4', _, 'F4', 'G4', _, 'A4', 'G4', 'F4',
      'C4', _, _, _, _, _, _, _] },
  ];
  const TOTAL = SONG.length * 64;

  let ac = null, out = null, filt = null, timer = null, step = 0, next = 0;
  let enabled = true, running = false;
  let mood = { night: false, rain: false };
  try { enabled = localStorage.getItem('mongmo_music') !== 'off'; } catch (e) { }

  function setup() {
    if (out) return true;
    ac = SFX.ctx(); if (!ac) return false;
    out = ac.createGain(); out.gain.value = 0;
    filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 2600; filt.Q.value = 0.4;
    filt.connect(out); out.connect(ac.destination);
    return true;
  }

  function pluck(m, t, dur, vol, vibrato) {
    const f = hz(N[m]);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(filt);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain();
    o1.type = 'triangle'; o2.type = 'sine'; g2.gain.value = 0.35;
    o1.frequency.setValueAtTime(f * 1.025, t); o1.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    o2.frequency.setValueAtTime(f * 2.05, t); o2.frequency.exponentialRampToValueAtTime(f * 2, t + 0.06);
    if (vibrato) {
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.014, t + 0.6);
      lfo.connect(lg); lg.connect(o1.frequency); lfo.start(t); lfo.stop(t + dur);
      // luyến lên rồi trả về (kiểu đàn bầu)
      o1.frequency.setValueAtTime(f, t + 0.35); o1.frequency.linearRampToValueAtTime(f * 1.06, t + 0.55); o1.frequency.linearRampToValueAtTime(f, t + 0.8);
    }
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function bass(m, t, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = hz(N[m]) / 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + STEP * 3.5);
    o.connect(g); g.connect(filt); o.start(t); o.stop(t + STEP * 4);
  }
  function pad(chord, t, vol) {
    CH[chord].forEach(m => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = hz(N[m]);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.5); g.gain.linearRampToValueAtTime(0.0001, t + STEP * 8);
      o.connect(g); g.connect(filt); o.start(t); o.stop(t + STEP * 8 + 0.05);
    });
  }
  function mo(t, vol, high) { // tiếng mõ gỗ
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(high ? 1250 : 880, t); o.frequency.exponentialRampToValueAtTime(high ? 1000 : 700, t + 0.05);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.1);
  }

  function schedule(i, t) {
    const sec = SONG[Math.floor(i / 64) % SONG.length], k = i % 64, bar = Math.floor(k / 8), beat = k % 8;
    const night = mood.night;
    const chord = sec.chords[bar];
    if (beat === 0) { pad(chord, t, night ? 0.012 : 0.016); bass(CH[chord][0], t, night ? 0.09 : 0.11); }
    if (beat === 4 && !night) bass(CH[chord][0], t, 0.07);
    let m = sec.mel[k];
    if (m) {
      let len = 1; while (len < 8 && k + len < 64 && !sec.mel[k + len]) len++;
      if (night && beat % 2 === 1) m = null; // ban đêm thưa nốt
      if (m) {
        const noteName = night && N[m] - 12 >= 60 ? Object.keys(N).find(x => N[x] === N[m] - 12) || m : m;
        pluck(noteName, t, Math.min(2.4, STEP * len + 0.9), night ? 0.07 : 0.1, len >= 4);
      }
    }
    if (!night && !mood.rain) {
      if (beat === 0 || beat === 3 || beat === 6) mo(t, 0.035, beat !== 0);
    } else if (!night && beat === 0) mo(t, 0.025, false);
  }

  function tick() {
    if (!ac) return;
    while (next < ac.currentTime + 0.15) {
      schedule(step, next);
      step = (step + 1) % TOTAL; next += STEP;
    }
  }

  function start() {
    if (!enabled || running || !setup()) return;
    running = true;
    next = ac.currentTime + 0.1;
    out.gain.cancelScheduledValues(ac.currentTime);
    out.gain.setValueAtTime(out.gain.value, ac.currentTime);
    out.gain.linearRampToValueAtTime(0.55, ac.currentTime + 1.5);
    timer = setInterval(tick, 40); tick();
  }
  function stop() {

function rrPath(c, x, y, w, h, r) {

function line(c, x1, y1, x2, y2, color = OUTLINE, lw = 2.5) {

function crimpPath(c, x, y, w, h, top = true, bottom = true, bulge = 3) {
  const n = Math.max(3, Math.round(w / 6));

const ICONS = {}, ICON_URLS = {};
function buildIcons() {
  const all = Object.assign({}, ITEMS, { _box: { icon: { k: 'box' } } });
  for (const id in all) {
    const cv = document.createElement('canvas');
    cv.width = ICON_W * ICON_RES; cv.height = ICON_H * ICON_RES;
    const c = cv.getContext('2d');
    c.scale(ICON_RES, ICON_RES);
    try { ICON_DRAW[all[id].icon.k](c, all[id].icon); } catch (e) { console.error('icon', id, e); }
    ICONS[id] = cv;
    try { ICON_URLS[id] = cv.toDataURL(); } catch (e) { ICON_URLS[id] = ''; }
  }
  // Ghi đè bằng ảnh PNG nếu có khai báo trong SPRITE_OVERRIDES (xem README)
  if (typeof SPRITE_OVERRIDES === 'object') {
    for (const id in SPRITE_OVERRIDES) {
      const img = new Image();
      img.onload = () => { ICONS[id] = img; ICON_URLS[id] = SPRITE_OVERRIDES[id]; };
      img.src = SPRITE_OVERRIDES[id];
    }
  }
}

function drawFloral(c, base, flower, seed, x, y, w, h) {
  c.fillStyle = base; c.fillRect(x, y, w, h);
  const R = mulberry(seed);
  for (let i = 0; i < w * h / 150; i++) {
    const fx = x + R() * w, fy = y + R() * h, r = 2 + R() * 1.5;
    c.fillStyle = flower;
    for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; c.beginPath(); c.arc(fx + Math.cos(a) * r, fy + Math.sin(a) * r, r * 0.7, 0, 7); c.fill(); }
    c.fillStyle = '#ffe680'; c.beginPath(); c.arc(fx, fy, r * 0.5, 0, 7); c.fill();
  }
}
function fillPattern(c, L, part, x, y, w, h) {
  const col = part === 'top' ? L.top : L.bottom;
  const pat = part === 'top' ? L.topPat : L.bottomPat;
  if (pat === 'floral') drawFloral(c, col, L.flower || '#f7a1c4', L.seed || 1, x, y, w, h);
  else if (pat === 'stripe') { c.fillStyle = col; c.fillRect(x, y, w, h); c.fillStyle = shade(col, -0.18); for (let yy = y; yy < y + h; yy += 8) c.fillRect(x, yy, w, 3.5); }

  else { c.fillStyle = col; c.fillRect(x, y, w, h); }
}

function drawArm(c, sx, sy, ang, len, L, hold, t) {

    const ex = sx + Math.sin(ang) * len * slv, ey = sy + Math.cos(ang) * len * slv;
    line(c, sx, sy, ex, ey, OUTLINE, 14);

  circ(c, hx, hy, 5.5, L.skin, 2.2);

  } else if (hold === 'fan') {

    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 26, -Math.PI * 0.85, -Math.PI * 0.15); c.closePath(); fs(c, '#f3d9a4', 2);
    c.strokeStyle = '#b08a4a'; c.lineWidth = 1; for (let i = 1; i < 8; i++) { const a = -Math.PI * 0.85 + i * Math.PI * 0.7 / 8; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * 25, Math.sin(a) * 25); c.stroke(); }
    c.beginPath(); c.arc(0, 0, 26, -Math.PI * 0.85, -Math.PI * 0.15); c.strokeStyle = '#c0392b'; c.lineWidth = 3; c.stroke();
    c.restore();
  } else if (hold === 'pen') {

    c.save(); c.translate(hx, hy); c.rotate(-0.2); rr(c, -14, -8, 24, 18, 2, '#fffbe6', 1.8); rr(c, -14, -8, 24, 4, 1, '#c0392b', 1.2);
    for (let i = 0; i < 3; i++) line(c, -11, i * 4 + 0, 7, i * 4 + 0, '#9fb6d6', 1);

}

// L: look, o: { pose, t, mood, walking, phase, talk, blinkSeed }
function drawChibi(c, x, fy, L, o) {
  const t = o.t || 0, s = (o.scale || 1) * (L.scale || 1);
  c.save(); c.translate(x, fy); c.scale(s, s);
  const pl = L.plump ? 1.18 : 1;
  const bw = 21 * pl;
  const wk = o.walking ? Math.sin(o.phase || 0) : 0;
  const bob = o.walking ? -Math.abs(Math.sin(o.phase || 0)) * 3 : Math.sin(t * 2.2 + (L.seed || 0)) * 0.8;

  // bóng
  c.save(); c.globalAlpha = 0.18; ell(c, 0, 0, 28 * pl, 6, '#000', 0); c.restore();

  // chân
  const legTop = -30;
  [[-9, wk * 4], [9, -wk * 4]].forEach(([lx, dy]) => {
    const footY = -4 + Math.min(0, dy);
    if (L.bottomType === 'pants') {
      rr(c, lx - 7, legTop, 14, footY - legTop + 2, 5, L.bottom, 2.2);
    } else {
      rr(c, lx - 5.5, legTop, 11, footY - legTop + 2, 5, L.skin, 2.2);
    }
    ell(c, lx + 1, footY + 1, 8, 4.2, L.shoes || '#6b4a2b', 2);
  });
  if (L.bottomType === 'shorts') {
    c.save(); rrPath(c, -bw + 2, legTop - 6, bw * 2 - 4, 20, 5); c.clip(); fillPattern(c, L, 'bottom', -bw, legTop - 8, bw * 2, 24); c.restore();
    rrPath(c, -bw + 2, legTop - 6, bw * 2 - 4, 20, 5); fs(c, null, 2.2);
    line(c, 0, legTop + 2, 0, legTop + 14, OUTLINE, 1.5);
  } else if (L.bottomType === 'skirt') {
    c.beginPath(); c.moveTo(-bw + 3, legTop - 6); c.lineTo(bw - 3, legTop - 6); c.lineTo(bw + 4, legTop + 12); c.lineTo(-bw - 4, legTop + 12); c.closePath();
    fs(c, L.bottom, 2.2);
    for (let i = -2; i <= 2; i++) line(c, i * 6, legTop - 4, i * 8, legTop + 10, shade(L.bottom, -0.3), 1);
  } else if (L.bottomType === 'pants' && L.bottomPat) {
    c.save(); c.beginPath(); c.rect(-bw, legTop - 4, bw * 2, 30); c.clip();
    [[-9], [9]].forEach(([lx]) => { c.save(); rrPath(c, lx - 7, legTop, 14, 26 - 1, 5); c.clip(); fillPattern(c, L, 'bottom', lx - 8, legTop, 16, 30); c.restore(); });
    c.restore();
    [[-9, wk * 4], [9, -wk * 4]].forEach(([lx, dy]) => { rrPath(c, lx - 7, legTop, 14, -4 + Math.min(0, dy) - legTop + 2, 5); fs(c, null, 2.2); });
  }

  c.translate(0, bob);
  // thân
  const shY = -76, hipY = -26;
  const torso = () => rrPath(c, -bw, shY, bw * 2, hipY - shY + 4, 13);
  // tay phía sau (nếu chéo)
  torso();
  c.save(); c.clip(); fillPattern(c, L, 'top', -bw - 2, shY - 2, bw * 2 + 4, hipY - shY + 8); c.restore();
  if (L.tank) { // áo ba lỗ
    c.save(); torso(); c.clip();
    c.beginPath(); c.moveTo(-bw - 2, shY - 2); c.lineTo(-10, shY - 2); c.quadraticCurveTo(0, shY + 18, 10, shY - 2); c.lineTo(bw + 2, shY - 2); c.lineTo(bw + 2, shY + 14); c.quadraticCurveTo(bw - 6, shY + 10, bw - 8, shY - 2); c.lineTo(-bw + 8, shY - 2); c.quadraticCurveTo(-bw + 6, shY + 10, -bw - 2, shY + 14); c.closePath();
    c.fillStyle = L.skin; c.fill(); c.restore();
  }
  torso(); fs(c, null, 2.5);
  if (L.jacket) { line(c, 0, shY + 6, 0, hipY + 2, shade(L.top, -0.35), 2); rr(c, -9, shY - 2, 18, 8, 3, shade(L.top, -0.15), 2); }

    rr(c, -bw + 5, shY + 14, bw * 2 - 10, hipY - shY - 4, 6, L.apron, 2.2);
    line(c, -bw + 6, shY + 16, -10, shY + 2, OUTLINE, 2); line(c, bw - 6, shY + 16, 10, shY + 2, OUTLINE, 2);
    rr(c, -12, shY + 32, 24, 14, 3, shade(L.apron, -0.15), 1.8);
    rr(c, -8, shY + 28, 7, 8, 1, '#5fae6b', 1); rr(c, 1, shY + 29, 7, 7, 1, '#d9709b', 1);
  }
  if (L.scarf) {
    c.beginPath(); c.moveTo(-12, shY + 2); c.lineTo(12, shY + 2); c.lineTo(0, shY + 12); c.closePath(); fs(c, L.scarf, 2);
    c.beginPath(); c.moveTo(-2, shY + 10); c.lineTo(-7, shY + 26); c.lineTo(-1, shY + 24); c.closePath(); fs(c, L.scarf, 1.8);
    c.beginPath(); c.moveTo(2, shY + 10); c.lineTo(7, shY + 26); c.lineTo(2, shY + 23); c.closePath(); fs(c, L.scarf, 1.8);
  }

  // tay
  const pose = o.pose || 'stand';
  const sx = bw - 3, sy = shY + 8, alen = 27;
  let la = 0.25, ra = -0.25, lh = null, rh = null;
  if (o.walking) { la = 0.2 + wk * 0.45; ra = -0.2 + wk * 0.45; }
  if (L.hold === 'basket') { lh = 'basket'; la = -0.15; }
  if (L.hold === 'money' && !o.walking) { rh = 'money'; ra = 1.1 + Math.sin(t * 3) * 0.08; }
  if (pose === 'wave') { ra = 2.6 + Math.sin(t * 12) * 0.35; }
  else if (pose === 'fan') { ra = 2.3; rh = 'fan'; la = -0.6; }
  else if (pose === 'pack') { la = -1.2 + Math.sin(t * 14) * 0.35; ra = -0.9 - Math.sin(t * 14) * 0.3; }
  else if (pose === 'write') { la = -0.9; lh = 'note'; ra = -0.65 + Math.sin(t * 16) * 0.12; rh = 'pen'; }
  else if (pose === 'cash') { ra = 0.95 + Math.sin(t * 6) * 0.12; rh = 'money'; }

  // tay trái (phía -x) dùng góc âm = hướng ra ngoài

  else if (L.hairStyle === 'short' || L.hairStyle === 'curly') { circ(c, 0, hy - 2, hr + 2, hairC, 2.5); }

function lerpColorKeys(keys, m) {
  if (m <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (m <= b[0]) { const t = (m - a[0]) / (b[0] - a[0]); return [mix(a[1], b[1], t), mix(a[2], b[2], t)]; }
  }
  return keys[keys.length - 1].slice(1);
}

function drawBubble(c, ax, ay, header, lines, patience, o = {}) {
  c.save();
  const pad = 10, lh = 30;
  c.font = `bold 16px ${FONT_HAND}`;
  let w = c.measureText(header).width + pad * 2 + 4;
  lines.forEach(l => { c.font = `bold 15px ${FONT_HAND}`; w = Math.max(w, c.measureText(l.text).width + (l.icon ? 34 : 0) + 34 + pad * 2); });
  w = Math.min(Math.max(w, 150), 300);
  const h = 32 + lines.length * lh + (patience !== null ? 12 : 0);
  let x = ax - w / 2; x = Math.max(o.minX !== undefined ? o.minX : 6, Math.min(x, 600 - w));
  const y = ay - h - 14;
  // đuôi
  c.beginPath(); c.moveTo(ax - 10, y + h - 2); c.lineTo(ax + 2, ay); c.lineTo(ax + 12, y + h - 2); c.closePath(); fs(c, '#fffdf5', 2.5);
  rr(c, x, y, w, h, 12, '#fffdf5', 2.5);
  c.beginPath(); c.moveTo(ax - 8, y + h - 2.5); c.lineTo(ax + 10, y + h - 2.5); c.strokeStyle = '#fffdf5'; c.lineWidth = 4; c.stroke();
  fitTxt(c, header, x + pad, y + 16, 16, w - pad * 2, o.headerColor || '#8a3a1a', { align: 'left' });
  let yy = y + 32;
  if (patience !== null) {
    rr(c, x + pad, yy - 4, w - pad * 2, 7, 3, '#eee', 1.2);
    const pc = patience > 0.5 ? '#5fae6b' : patience > 0.25 ? '#f0b429' : '#e0453a';
    if (patience > 0.01) rr(c, x + pad, yy - 4, (w - pad * 2) * patience, 7, 3, pc, 0);
    yy += 10;
  }
  lines.forEach(l => {
    let lx = x + pad;
    if (l.icon) { c.drawImage(ICONS[l.icon], lx, yy + 1, 22, 28); lx += 28; }
    const col = l.oos ? '#aaa' : l.done ? '#2e7d4a' : (l.color || '#3b2a20');
    fitTxt(c, l.text, lx, yy + lh / 2, 15, x + w - pad - 18 - lx, col, { align: 'left' });
    if (l.oos) { c.font = `bold 15px ${FONT_HAND}`; const tw = c.measureText(l.text).width; line(c, lx, yy + lh / 2, lx + tw, yy + lh / 2, '#c0392b', 2); }
    if (l.done) txt(c, '✔', x + w - pad - 6, yy + lh / 2, 16, '#2e7d4a');
    yy += lh;
  });
  c.restore();
  return { x, y, w, h };
}

  let modalPaused = false, modalWasPaused = false, modalKind = null;
  let lastHud = '';

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const icon = (id, cls = 'ic') => `<img class="${cls}" src="${ICON_URLS[id]}" alt="">`;
  const billHtml = (v, attrs = '') => `<button class="bill" style="--c:${BILL_COLORS[v]}" ${attrs}><span>${(v / 1000).toLocaleString('vi-VN')}k</span></button>`;

  function init() {
    $('#hud').innerHTML = `
      <div class="hgroup">
        <div class="chip" id="h-day"></div>
        <div class="chip" id="h-time"></div>
      </div>
      <div class="hgroup">
        <div class="chip money" id="h-money" title="Tiền mặt"></div>
        <div class="chip" id="h-rep" title="Uy tín — càng cao càng đông khách"></div>
        <div class="chip debt" id="h-debt" title="Tổng tiền khách đang nợ"></div>
      </div>
      <div class="hgroup">
        <button class="hbtn" id="b-stock">📦<span class="lbl"> Nhập hàng</span></button>
        <button class="hbtn" id="b-up">🛠️<span class="lbl"> Nâng cấp</span></button>
        <button class="hbtn" id="b-debt">📒<span class="lbl"> Sổ nợ</span></button>
        <button class="hbtn sm" id="b-speed" title="Tốc độ">×1</button>
        <button class="hbtn sm" id="b-pause" title="Tạm dừng (Space)">⏸</button>
        <button class="hbtn sm" id="b-music" title="Nhạc nền">🎵</button>
        <button class="hbtn sm" id="b-sound" title="Âm thanh">🔊</button>
        <button class="hbtn sm" id="b-fs" title="Toàn màn hình">⛶</button>
      </div>`;
    $('#b-stock').onclick = () => openRestock();
    $('#b-up').onclick = () => openUpgrades();
    $('#b-debt').onclick = () => openDebtBook();
    $('#b-speed').onclick = () => { speed = speed === 1 ? 2 : 1; updateHUD(); };
    $('#b-pause').onclick = () => { if (phase === 'open' || phase === 'closing') togglePause(); };
    $('#b-sound').onclick = () => { const m = SFX.toggle(); $('#b-sound').textContent = m ? '🔇' : '🔊'; };
    const musicBtn = () => { $('#b-music').classList.toggle('off', !MUSIC.enabled); $('#b-music').title = MUSIC.enabled ? 'Tắt nhạc nền' : 'Bật nhạc nền'; };
    $('#b-music').onclick = () => { SFX.ctx(); MUSIC.toggle(); musicBtn(); };
    musicBtn();
    if (!canFullscreen()) $('#b-fs').style.display = 'none';
    $('#b-fs').onclick = () => toggleFullscreen();
    // màn hình dọc trên điện thoại
    $('#rotate').innerHTML = `<div class="rot-box"><div class="rot-phone">📱</div>
      <b>Xoay ngang điện thoại để chơi</b><span>Game chơi màn hình ngang cho to, dễ bấm</span>
      ${canFullscreen() ? '<button class="btn go big" id="rot-go">⛶ Chơi toàn màn hình</button>' : '<span class="muted">iPhone: bấm Chia sẻ → "Thêm vào MH chính" để chơi toàn màn hình</span>'}
      <button class="rot-skip" id="rot-skip">Vẫn chơi màn hình dọc</button></div>`;
    const rg = $('#rot-go'); if (rg) rg.onclick = () => goFullscreen(true);
    $('#rot-skip').onclick = () => document.body.classList.add('rot-skip');
    document.addEventListener('pointerdown', () => SFX.unlock(), { capture: true });
    $('#bar').addEventListener('click', onBarClick);
    $('#change').addEventListener('click', onChangeClick);
    refreshBar();
  }

  function stars(r) {
    let s = '';
    for (let i = 1; i <= 5; i++) s += r >= i - 0.25 ? '★' : r >= i - 0.75 ? '⯪' : '☆';
    return s;
  }
  function totalDebt() { return Object.values(G.debts).reduce((a, d) => a + d.amt, 0); }

  function updateHUD() {
    if (!G) return;
    const m = Math.floor(G.minute), hh = String(Math.floor(m / 60)).padStart(2, '0'), mm = String(m % 60).padStart(2, '0');
    const fsOn = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const key = [G.day, G.weather, hh, mm, G.money, G.rep.toFixed(2), totalDebt(), speed, paused, phase, fsOn].join('|');
    if (key === lastHud) return; lastHud = key;
    $('#h-day').textContent = `📅 Ngày ${G.day} ${G.weather === 'mua' ? '🌧️' : '☀️'}`;
    $('#h-time').textContent = `🕐 ${hh}:${mm}`;
    $('#h-time').classList.toggle('late', m >= CLOSE_MIN - 30);
    $('#h-money').textContent = '💰 ' + money(G.money);
    $('#h-money').classList.toggle('neg', G.money < 0);
    $('#h-rep').innerHTML = `<span class="stars">${stars(G.rep)}</span> ${G.rep.toFixed(1)}`;
    const d = totalDebt();
    $('#h-debt').textContent = '📒 Nợ: ' + money(d);
    $('#h-debt').style.display = d ? '' : 'none';
    $('#b-speed').textContent = '×' + speed;
    $('#b-pause').textContent = paused && (phase === 'open' || phase === 'closing') ? '▶' : '⏸';
    $('#b-fs').classList.toggle('on', fsOn); $('#b-fs').title = fsOn ? 'Thoát toàn màn hình' : 'Toàn màn hình';
  }
  function tick() { updateHUD(); }

  // ---------------- thanh hành động ----------------
  function refreshBar() {
    const bar = $('#bar');
    if (!G || phase === 'menu') { bar.innerHTML = ''; return; }
    const c = front();
    if (!c) {
      const waiting = customers.length;
      bar.innerHTML = `<div class="bar-msg">${phase === 'closing' ? '🌙 Hết giờ bán — chờ khách cuối rồi dọn tiệm' : waiting ? '🚶 Khách đang đi tới...' : '☕ Chưa có khách — Cô Hoa ngồi quạt. Tranh thủ <b>📦 Nhập hàng</b> nếu kệ trống!'}</div>`;
      return;
    }
    if (c.state === 'order') {
      const ids = Object.keys(bag);
      const chips = ids.length ? ids.map(id => `<button class="chipitem" data-rm="${id}" title="Bấm để bỏ ra">${icon(id)}<b>×${bag[id]}</b></button>`).join('') : '<span class="hint">👉 Bấm vào hàng trên kệ để bỏ vào bịch</span>';
      const d = c.reg && G.debts[c.reg.name];
      bar.innerHTML = `
        <div class="bag"><div class="bag-label">🛍️ Bịch hàng</div><div class="bag-items">${chips}</div></div>
        <div class="total"><small>Tổng</small><b>${money(bagTotal())}</b></div>
        <div class="acts">
          ${d && !c.remindDone ? `<button class="btn ghost" data-a="remind">📒 Nhắc nợ ${money(d.amt)}</button>` : ''}
          <button class="btn ghost" data-a="oos" title="Báo khách món họ cần đã hết">🚫 Báo hết hàng</button>
          ${ids.length ? '<button class="btn ghost" data-a="clear">↩ Bỏ ra hết</button>' : ''}
          <button class="btn go" data-a="give">✔ Giao hàng <small>(Enter)</small></button>
        </div>`;
    } else if (c.state === 'credit') {
      const d = G.debts[c.reg.name];
      bar.innerHTML = `
        <div class="bar-msg">📒 <b>${esc(c.name)}</b> xin ghi sổ <b>${money(c.total)}</b>${d ? ` <span class="muted">(đang nợ ${money(d.amt)})</span>` : ''}. Khách quen hay bị từ chối sẽ buồn đó!</div>
        <div class="acts">
          <button class="btn go" data-a="credit-yes">📒 Ghi sổ</button>
          <button class="btn ghost" data-a="credit-no">💵 Trả tiền mặt nha!</button>
        </div>`;
    } else if (c.state === 'pay') {
      bar.innerHTML = `<div class="bar-msg">💵 Đang thối tiền cho <b>${esc(c.name)}</b>... Đếm cho kỹ nha!</div>`;
    } else bar.innerHTML = '';
  }
  function onBarClick(e) {
    SFX.unlock();
    const rm = e.target.closest('[data-rm]');
    if (rm) { removeFromBag(rm.dataset.rm); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (paused) return;
    ({ give: handOver, oos: reportOOS, clear: clearBag, remind: remindDebt, 'credit-yes': creditAccept, 'credit-no': creditRefuse })[a.dataset.a]();
  }

  // ---------------- thối tiền ----------------
  function openChange(p) {
    const el = $('#change');
    el.classList.remove('hidden');
    el.innerHTML = `
      <div class="ch-head">💵 Thối tiền</div>
      <div class="ch-row"><span>Tổng tiền hàng</span><b>${money(p.total)}</b></div>
      <div class="ch-row"><span>Khách đưa</span><b class="green">${money(p.paid)}</b></div>
      <div class="ch-bills">${p.pay.map(v => billHtml(v, 'disabled')).join('')}</div>
      <div class="ch-row need"><span>Cần thối</span><b id="ch-need">?</b></div>
      <div class="ch-sub">Bấm tiền trong ngăn kéo để thối (bấm tiền đã đưa để lấy lại):</div>
      <div class="ch-tray" id="ch-tray"></div>
      <div class="ch-row"><span>Đang thối</span><b id="ch-given">0đ</b></div>
      <div class="ch-drawer">${BILLS.filter(v => v <= 200000).map(v => billHtml(v, `data-give="${v}"`)).join('')}</div>
      <div class="ch-acts">
        <button class="btn ghost" data-ch="calc">🧮 Bấm máy tính</button>
        <button class="btn ghost" data-ch="reset">↩ Đếm lại</button>
        <button class="btn go" data-ch="ok">✔ Thối tiền</button>
      </div>`;
    updateChange(p.hinted);
    refreshBar();
  }
  function updateChange(hinted) {
    if (!payCtx) return;
    const g = payCtx.given.reduce((a, b) => a + b, 0);
    $('#ch-tray').innerHTML = payCtx.given.length ? payCtx.given.map((v, i) => billHtml(v, `data-take="${i}"`)).join('') : '<span class="hint">(chưa đưa đồng nào)</span>';
    $('#ch-given').textContent = money(g);
    if (hinted || payCtx.hinted) $('#ch-need').textContent = money(payCtx.change);
  }
  function closeChange() { $('#change').classList.add('hidden'); $('#change').innerHTML = ''; }
  function shakeChange() { const el = $('#change'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function onChangeClick(e) {
    if (paused) return;
    const g = e.target.closest('[data-give]'); if (g) { giveBill(+g.dataset.give); return; }
    const tk = e.target.closest('[data-take]'); if (tk) { takeBackBill(+tk.dataset.take); return; }
    const a = e.target.closest('[data-ch]'); if (!a) return;
    if (a.dataset.ch === 'ok') confirmChange();
    else if (a.dataset.ch === 'calc') calcHint();
    else if (a.dataset.ch === 'reset') { payCtx.given = []; updateChange(); }
  }

  // ---------------- modal chung ----------------
  function openModal(html, kind, opts = {}) {
    const bg = $('#modal-bg'), m = $('#modal');
    if (!modalKind) { modalWasPaused = paused; }
    modalKind = kind;
    paused = true;
    m.className = opts.wide ? 'wide' : '';
    m.innerHTML = html + (opts.noClose ? '' : '<button class="mclose" data-close>✕</button>');
    bg.classList.remove('hidden');
    const cl = m.querySelector('[data-close]'); if (cl) cl.onclick = closeModal;
    updateHUD();
  }
  function closeModal() {
    $('#modal-bg').classList.add('hidden');
    const kind = modalKind; modalKind = null;
    if (phase === 'open' || phase === 'closing') paused = modalWasPaused;
    updateHUD(); refreshBar();
    return kind;
  }
  function modalOpen() { return !!modalKind; }

  // ---------------- nhập hàng ----------------
  const GROUPS = [
    ['Đồ ăn vặt', ['snacktom', 'bimbim', 'mitom', 'phogoi', 'banhgau', 'hatdua']],
    ['Gia vị & đồ khô', ['nuocmam', 'nuoctuong', 'tuongot', 'dauan', 'botngot', 'hatnem', 'duong', 'caphe', 'suadac', 'suahop', 'botgiat']],
    ['Đồ uống (tủ mát)', ['nuocsuoi', 'nuocngot', 'suachua', 'tangluc', 'bia', 'nuocda']],
    ['Bánh kẹo (tủ kính)', ['keome', 'banhtrang', 'keomut', 'banhbonglan']],
    ['Gia dụng & linh tinh', ['daugoi', 'nhang', 'batlua', 'nhangmuoi', 'xo', 'choi']],
    ['Thẻ cào', ['thecao10', 'thecao20', 'thecao50']],
  ];
  function openRestock(back) {
    if (phase === 'menu') return;
    let fullCost = 0;
    const rows = GROUPS.map(([gname, ids]) => {
      const cells = ids.map(id => {
        const it = ITEMS[id], locked = isLocked(id), s = G.stock[id];
        if (!locked) fullCost += (MAX_STOCK - s) * it.cost;
        return `<div class="rs-item ${locked ? 'locked' : ''} ${s <= 2 && !locked ? 'low' : ''}">
          ${icon(id, 'rs-ic')}
          <div class="rs-info"><b>${it.name}</b>
            <small>Bán ${money(it.price)} • Vốn ${money(it.cost)}</small>
            <div class="rs-stock"><div style="width:${s / MAX_STOCK * 100}%"></div><span>${locked ? '🔒' : s + '/' + MAX_STOCK}</span></div>
          </div>
          ${locked ? '' : `<div class="rs-btns"><button data-rs="${id}" data-q="1">+1</button><button data-rs="${id}" data-q="5">+5</button><button data-rs="${id}" data-q="99">Đầy</button></div>`}
        </div>`;
      }).join('');
      return `<h3>${gname}</h3><div class="rs-grid">${cells}</div>`;
    }).join('');
    openModal(`<h2>📦 Nhập hàng từ đại lý</h2>
      <div class="m-sub">Tiền mặt: <b class="${G.money < 0 ? 'red' : ''}">${money(G.money)}</b> • Nhập đầy hết: <b>${money(fullCost)}</b>
      <button class="btn go sm" data-rsall>Nhập đầy tất cả</button></div>
      <div class="rs-scroll">${rows}</div>
      ${back ? `<div class="m-acts"><button class="btn go" data-back>← Quay lại tổng kết</button></div>` : ''}`, 'restock', { wide: true });
    const m = $('#modal');
    m.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => {
      const q = restock(b.dataset.rs, +b.dataset.q);
      if (!q) toast(G.stock[b.dataset.rs] >= MAX_STOCK ? 'Kệ đầy rồi!' : 'Không đủ tiền!');
      const st = m.querySelector('.rs-scroll').scrollTop;
      openRestock(back); $('#modal .rs-scroll').scrollTop = st;
    });
    m.querySelector('[data-rsall]').onclick = () => {
      let spent = 0;
      for (const [, ids] of GROUPS) for (const id of ids) if (!isLocked(id)) spent += restock(id, MAX_STOCK) * ITEMS[id].cost;
      if (!spent) toast('Không nhập được gì (đầy kệ hoặc hết tiền)'); else toast('Đã nhập hàng: −' + money(spent));
      const st = m.querySelector('.rs-scroll').scrollTop;
      openRestock(back); $('#modal .rs-scroll').scrollTop = st;
    };
    const bk = m.querySelector('[data-back]'); if (bk) bk.onclick = back;
    if (back) m.querySelector('[data-close]').onclick = back;
  }

  // ---------------- nâng cấp ----------------
  function openUpgrades(back) {
    if (phase === 'menu') return;
    const list = UPGRADES.map(u => {
      const own = G.upgrades[u.id], can = G.money >= u.price;
      const items = Object.keys(ITEMS).filter(id => ITEMS[id].lock === u.id);
      return `<div class="up ${own ? 'own' : ''}">
        <div class="up-info"><b>${u.name}</b><p>${u.desc}</p>
          ${items.length ? `<div class="up-items">${items.map(id => icon(id)).join('')}</div>` : ''}</div>
        <div class="up-buy">${own ? '<span class="owned">✔ Đã có</span>' : `<b>${money(u.price)}</b><button class="btn ${can ? 'go' : 'ghost'}" data-up="${u.id}" ${can ? '' : 'disabled'}>Mua</button>`}</div>
      </div>`;
    }).join('');
    openModal(`<h2>🛠️ Nâng cấp tiệm</h2><div class="m-sub">Tiền mặt: <b>${money(G.money)}</b></div><div class="up-list">${list}</div>
      ${back ? `<div class="m-acts"><button class="btn go" data-back>← Quay lại tổng kết</button></div>` : ''}`, 'upgrades', { wide: true });
    const m = $('#modal');
    m.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
      if (buyUpgrade(b.dataset.up)) toast('🎉 Đã mua: ' + UPGRADES.find(u => u.id === b.dataset.up).name);
      openUpgrades(back);
    });
    const bk = m.querySelector('[data-back]'); if (bk) bk.onclick = back;
    if (back) m.querySelector('[data-close]').onclick = back;
  }

  // ---------------- sổ nợ ----------------
  function openDebtBook() {
    if (phase === 'menu') return;
    const names = Object.keys(G.debts);
    const rows = names.length ? names.map(n => {
      const d = G.debts[n], r = REGULARS.find(r => r.name === n);
      const age = G.day - d.day;
      return `<tr><td><b>${esc(n)}</b> <small>${r ? CUSTOMER_TYPES[r.type].label : ''}</small></td><td class="r">${money(d.amt)}</td>
        <td><small>${age ? age + ' ngày trước' : 'hôm nay'}</small></td><td><button class="btn ghost sm" data-forgive="${esc(n)}">Xóa nợ</button></td></tr>`;
    }).join('') : '<tr><td colspan="4" class="empty">Chưa ai nợ. Sổ trắng tinh! ✨</td></tr>';
    openModal(`<div class="notebook"><h2>📒 Sổ Nợ</h2>
      <table class="debts">${rows}</table>
      <p class="m-sub">Khách quen hay xin ghi sổ. Người thật thà sẽ tự trả khi ghé lại — hoặc bấm <b>Nhắc nợ</b> khi họ đứng ở quầy.<br>
      <b>Xóa nợ</b> = coi như cho luôn (+ uy tín, mất tiền).</p></div>`, 'debt');
    $('#modal').querySelectorAll('[data-forgive]').forEach(b => b.onclick = () => {
      const n = b.dataset.forgive;
      ask(`Xóa nợ cho <b>${esc(n)}</b>? Coi như cho luôn <b>${money(G.debts[n].amt)}</b>.`, 'Xóa nợ', () => {
        addRep(Math.min(0.3, G.debts[n].amt / 200000));
        delete G.debts[n]; saveGame(); openDebtBook();
      }, openDebtBook);
    });
  }

  // hộp xác nhận (trang đăng online không hiện được confirm() của trình duyệt)
  function ask(html, yesLabel, onYes, onNo) {
    openModal(`<div class="ask"><p>${html}</p>
      <div class="m-acts"><button class="btn ghost" data-no>Thôi</button><button class="btn go" data-yes>${yesLabel}</button></div></div>`, 'ask', { noClose: true });
    $('#modal [data-yes]').onclick = () => { closeModal(); onYes(); };
    $('#modal [data-no]').onclick = () => { closeModal(); if (onNo) onNo(); };
  }

  // ---------------- trong lúc vắng mặt ----------------
  function fmtDur(ms) {
    const m = Math.round(ms / 60000), h = Math.floor(m / 60);
    return h ? `${h} giờ ${m % 60} phút` : `${m} phút`;
  }
  function showOffline(r, after) {
    if (!after) {
      if (modalKind === 'summary' && lastSummary) after = () => showSummary(lastSummary);
      else if (modalKind === 'menu' || modalKind === 'help' || modalKind === 'ask' && phase === 'menu') after = () => showMenu(true);
    }
    const top = Object.entries(r.sold).sort((a, b) => b[1] - a[1]).slice(0, 8);
    openModal(`<div class="offline">
      <h2>🌙 Trong lúc bạn đi vắng...</h2>
      <p class="off-line">Bạn vắng <b>${fmtDur(r.ms)}</b>${r.capped ? ` (tính tối đa ${OFFLINE_MAX_H} tiếng)` : ''}. Cô Hoa vẫn mở tiệm bán giùm:</p>
      ${r.count ? `<div class="off-items">${top.map(([id, n]) => `<div class="off-it">${icon(id)}<b>×${n}</b></div>`).join('')}</div>
        <p class="off-line">Bán được <b>${r.count}</b> món</p>` : '<p class="off-line">Không bán được món nào...</p>'}
      ${r.repaid.map(([n, a]) => `<p class="off-line">📒 <b>${esc(n)}</b> ghé trả nợ <b class="green">${money(a)}</b></p>`).join('')}
      <div class="off-total">+${money(r.earned)}</div>
      ${r.ranOut ? '<p class="off-warn">⚠️ Kệ trống trơn rồi! Nhập đầy hàng trước khi đi để Cô Hoa bán được nhiều hơn.</p>' : '<p class="m-sub">Mẹo: uy tín càng cao, kệ càng đầy thì vắng mặt càng kiếm được nhiều.</p>'}
      <div class="m-acts"><button class="btn go big" data-off>💰 Nhận tiền</button></div></div>`, 'offline', { noClose: true });
    $('#modal [data-off]').onclick = () => { SFX.unlock(); goFullscreen(); SFX.ching(); closeModal(); if (after) after(); };
  }

  // ---------------- tổng kết ngày ----------------
  let lastSummary = null;
  function showSummary(s) {
    lastSummary = s;
    const profit = s.sales - s.cost - s.elec - s.lostChange;
    const html = `<div class="summary">
      <h2>🌙 Hết ngày ${s.day}</h2>
      <div class="sum-grid">
        <div><span>Khách vui vẻ</span><b>${s.served} 😊</b></div>
        <div><span>Khách bỏ về</span><b class="${s.angry ? 'red' : ''}">${s.angry} 😠</b></div>
        <div><span>Doanh thu</span><b>${money(s.sales)}</b></div>
        <div><span>Giá vốn hàng bán</span><b>−${money(s.cost)}</b></div>

const SFX = (() => {
  let ac = null, muted = false;
  const ensure = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0, slide = 0) {
    if (muted || !ensure()) return;
    const o = ac.createOscillator(), g = ac.createGain();
    const t0 = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    ctx: ensure,
    unlock() { ensure(); if (typeof MUSIC !== 'undefined' && !document.hidden) MUSIC.start(); },
    toggle() { muted = !muted; return muted; },
    get muted() { return muted; },
    pick() { tone(660, 0.08, 'triangle', 0.12); tone(990, 0.06, 'triangle', 0.08, 0.04); },
    drop() { tone(440, 0.07, 'triangle', 0.1, 0, 0.7); },
    ching() { tone(1318, 0.15, 'square', 0.06); tone(1760, 0.35, 'triangle', 0.12, 0.08); tone(2637, 0.4, 'sine', 0.06, 0.12); },
    bad() { tone(220, 0.18, 'sawtooth', 0.07, 0, 0.7); tone(180, 0.2, 'sawtooth', 0.06, 0.1, 0.7); },
    door() { tone(880, 0.25, 'sine', 0.12); tone(698, 0.35, 'sine', 0.12, 0.18); },

    bill() { tone(520 + rnd() * 80, 0.05, 'triangle', 0.08); },

})();

function resize() {

  OX = SW - VW;
  const s = Math.min(w / SW, h / VH);
  stage.style.width = SW + 'px';
  stage.style.transform = `translate(${(w - SW * s) / 2}px, ${(h - VH * s) / 2}px) scale(${s})`;
  stage.style.setProperty('--ox', OX + 'px');
  stage.style.setProperty('--s', s);
  const phone = s < 0.78;
  document.body.classList.toggle('phone', phone);
  UIK = phone ? 1.3 : 1;
  PR = s * Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = SW + 'px';
  canvas.width = Math.round(SW * PR); canvas.height = Math.round(VH * PR);

}
// Toàn màn hình + khóa xoay ngang (Android). iPhone: dùng "Thêm vào MH chính".
const isTouch = () => window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function goFullscreen(force) {
  const el = document.documentElement;
  const lock = () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { }); } catch (e) { } };
  if (document.fullscreenElement || document.webkitFullscreenElement) { lock(); return; }
  if (!force && !isTouch()) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try { const p = req.call(el, { navigationUI: 'hide' }); if (p && p.then) p.then(lock).catch(() => { }); else lock(); } catch (e) { }
}
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else goFullscreen(true);
}
const canFullscreen = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function rebuildLayers() {
  if (!G) return;
  [[backCv, c => buildBackLayer(c, G, OX)], [frontCv, c => buildFrontLayer(c)]].forEach(([cv, fn]) => {
    cv.width = canvas.width; cv.height = canvas.height;

function hourMul(type, hour) {
  for (const [a, b, m] of CUSTOMER_TYPES[type].hours) if (hour >= a && hour < b) return m;
  return 1;
}
function pickType() {
  const hour = G.minute / 60, U = G.upgrades;
  const base = { hocsinh: 1, hangxom: 1.25, ongcu: 0.8, shipper: 0.65, mevabe: 0.7 };
  if (U.tukinh) base.hocsinh *= 1.5;
  if (U.thecao) base.shipper *= 2;
  if (U.banghe) base.ongcu *= 1.5;
  if (U.tulanh) { base.shipper *= 1.2; base.ongcu *= 1.3; }
  if (U.giadung) base.hangxom *= 1.2;
  const w = {}; let sum = 0;
  for (const k in base) { w[k] = base[k] * hourMul(k, hour); sum += w[k]; }
  if (sum <= 0) return 'hangxom';
  let r = rnd() * sum;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return 'hangxom';
}
function makeRequest(type) {
  const T = CUSTOMER_TYPES[type];
  const pool = [];
  for (const id in T.wants) {
    if (!ITEMS[id] || isLocked(id)) continue;
    let w = T.wants[id];
    const isDrink = ['nuocsuoi', 'nuocngot', 'tangluc', 'bia', 'nuocda', 'suachua'].includes(id);
    if (G.weather === 'nang' && isDrink) w *= 1.7;
    if (G.weather === 'mua' && (id === 'mitom' || id === 'phogoi')) w *= 2.2;
    if (G.weather === 'mua' && isDrink) w *= 0.5;
    pool.push([id, w]);
  }
  let n = 1 + (rnd() < 0.5 ? 1 : 0) + (rnd() < 0.22 ? 1 : 0);
  n = Math.min(n, T.maxItems, pool.length);
  const req = [];
  for (let i = 0; i < n; i++) {
    const sum = pool.reduce((a, p) => a + p[1], 0);
    let r = rnd() * sum, k = 0;
    for (; k < pool.length; k++) { r -= pool[k][1]; if (r <= 0) break; }
    k = Math.min(k, pool.length - 1);
    const id = pool[k][0]; pool.splice(k, 1);
    const qty = rnd() < 0.72 ? 1 : 1 + Math.ceil(rnd() * (T.maxQty - 1));
    req.push({ id, qty, oos: false });
  }
  return req;
}
function spawnCustomer() {
  if (customers.length >= QUEUE_X.length) return;
  const type = pickType();
  let reg = null;
  if (rnd() < 0.45) {
    const cands = REGULARS.filter(r => r.type === type && !customers.concat(leavers).some(c => c.reg === r));
    if (cands.length) reg = rpick(cands);
  }
  const req = makeRequest(type);
  if (!req.length) return;
  const T = CUSTOMER_TYPES[type];
  const look = makeLook(type, reg ? reg.name : 'khach' + (++cid) + rnd(), reg || {});
  customers.push({
    id: ++cid, type, reg, name: reg ? reg.name : T.label, look,
    greet: rpick(T.greet), x: -OX - 80, walking: true, phase: 0,
    state: 'queue', patience: 1, req, mood: 'neutral', say: null, sayUntil: 0, remindDone: false,
  });

}
function front() { const c = customers[0]; return c && c.state !== 'queue' ? c : null; }

function clickSlot(id) {
  if (isLocked(id)) { const u = UPGRADES.find(u => u.id === ITEMS[id].lock); UI.toast(`🔒 Cần mua nâng cấp "${u.name}"`); SFX.bad(); return; }

  setHoa('pack', 0.45);

}
function removeFromBag(id) {

  if (!bag[id]) delete bag[id];

function clearBag() { returnBag(); SFX.drop(); UI.refreshBar(); }

function bagTotal() { let s = 0; for (const id in bag) s += ITEMS[id].price * bag[id]; return s; }

function handOver() {
  const c = front(); if (!c || c.state !== 'order') return;
  const need = {};
  c.req.forEach(r => { if (!r.oos) need[r.id] = r.qty; });
  let missing = null, extra = null;
  for (const id in need) if ((bag[id] || 0) < need[id]) missing = id;
  for (const id in bag) if (bag[id] > (need[id] || 0)) extra = id;
  if (extra) { say(c, fill(rpick(LINES.extra), lower1(ITEMS[extra].name))); c.patience -= 0.08; SFX.bad(); return; }
  if (missing) { say(c, fill(rpick(LINES.missing), lower1(ITEMS[missing].name))); c.patience -= 0.06; SFX.bad(); return; }
  const total = bagTotal();
  c.items = Object.assign({}, bag); bag = {};
  c.total = total;
  G.stats.cost += Object.keys(c.items).reduce((a, id) => a + ITEMS[id].cost * c.items[id], 0);
  setHoa('pack', 0.6);
  const T = CUSTOMER_TYPES[c.type];
  const debt = c.reg && G.debts[c.reg.name] ? G.debts[c.reg.name].amt : 0;
  if (c.reg && rnd() < T.credit && debt + total <= CREDIT_LIMIT) {
    c.state = 'credit';
    c.creditLine = rpick(LINES.credit[c.type] || LINES.credit.hangxom);
  } else startPayment(c);
  UI.refreshBar();
}

function exactBills(amount) {
  const out = []; const den = BILLS.slice().reverse();
  for (const b of den) while (amount >= b) { out.push(b); amount -= b; }
  return out;
}
function makePayment(c, total) {
  const T = CUSTOMER_TYPES[c.type];
  if (rnd() < T.exact) return exactBills(total);
  const asc = T.bills.slice().sort((a, b) => a - b);
  const pay = []; let sum = 0;
  while (sum < total) {
    const needAmt = total - sum;
    const fit = asc.filter(b => b >= needAmt);
    const b = fit.length ? (rnd() < 0.7 ? fit[0] : rpick(fit)) : asc[asc.length - 1];
    pay.push(b); sum += b;
  }
  const r = total % 10000;
  if (r && sum - total > r && rnd() < 0.3) pay.push(...exactBills(r)); // đưa thêm tiền lẻ cho chẵn
  return pay.sort((a, b) => b - a);
}
function startPayment(c) {
  c.state = 'pay';
  const pay = makePayment(c, c.total);
  const paid = pay.reduce((a, b) => a + b, 0);
  const change = paid - c.total;
  payCtx = { cust: c, total: c.total, pay, paid, change, given: [], hinted: false };
  if (change === 0) { finishSale(c, 'exact'); return; }
  if (change <= 2000 && (c.type === 'shipper' || c.type === 'ongcu') && rnd() < 0.45) {
    say(c, rpick(LINES.keepCh), 2.2);
    finishSale(c, 'keep'); return;
  }
  setHoa('cash', 99);
  UI.openChange(payCtx);
}
function giveBill(v) { if (!payCtx) return; payCtx.given.push(v); SFX.bill(); UI.updateChange(); }
function takeBackBill(i) { if (!payCtx) return; payCtx.given.splice(i, 1); SFX.drop(); UI.updateChange(); }
function calcHint() {
  if (payCtx) {
    calc.text = (payCtx.change / 1000) + '.000';
    calc.flashUntil = t + 3;
    if (!payCtx.hinted) { payCtx.hinted = true; payCtx.cust.patience -= 0.08; }
    UI.updateChange(true);
  } else {
    calc.flashUntil = t + 1;
  }
  SFX.write();
}
function confirmChange() {
  const p = payCtx; if (!p) return;
  const g = p.given.reduce((a, b) => a + b, 0);
  const c = p.cust;
  if (g < p.change) {
    say(c, rpick(LINES.shortCh)); c.patience -= 0.1; addRep(-0.03); SFX.bad();
    UI.shakeChange(); return;
  }
  if (g > p.change) {
    const excess = g - p.change;
    const honest = c.reg ? c.reg.honesty : 0.45;
    if (rnd() < honest) { say(c, rpick(LINES.extraCh), 2.2); addRep(0.02); finishSale(c, 'ok'); }
    else { G.money -= excess; G.stats.lostChange += excess; addFloat('Thối dư ' + money(excess) + ' 😅', 520, 410, '#c0392b'); finishSale(c, 'ok'); }
    return;
  }
  finishSale(c, 'perfect');
}
function finishSale(c, how) {
  const p = payCtx && payCtx.cust === c ? payCtx : null;
  if (how === 'credit') {
    const d = G.debts[c.reg.name] || { amt: 0, day: G.day };
    d.amt += c.total; G.debts[c.reg.name] = d;
    G.stats.credit += c.total;
    addFloat('📒 Ghi sổ ' + money(c.total), 470, 420, '#2a5a9c');
    setHoa('write', 1.4); SFX.write();
  } else {
    let paid;
    if (p) paid = how === 'keep' ? p.paid : p.paid - p.change;
    else paid = c.total;
    G.money += paid;
    addFloat('+' + money(paid), 520, 430, '#2e7d4a');
    SFX.ching();
    setHoa('wave', 1);
  }
  G.stats.sales += c.total; G.stats.served++;
  const gain = 0.015 + 0.04 * clamp(c.patience, 0, 1) + (how === 'perfect' ? 0.015 : 0);
  addRep(gain);
  if (!c.say || c.sayUntil < t) say(c, rpick(LINES.thanks), 2.2);
  payCtx = null; UI.closeChange();
  calc.text = '0';
  leave(c, 'happy');
}
function creditAccept() { const c = front(); if (c && c.state === 'credit') { addRep(0.04); finishSale(c, 'credit'); } }
function creditRefuse() {
  const c = front(); if (!c || c.state !== 'credit') return;
  if (rnd() < 0.65) { say(c, rpick(LINES.refuseOk), 2); startPayment(c); UI.refreshBar(); }
  else {
    say(c, rpick(LINES.refuseNo), 2.4); addRep(-0.08);
    for (const id in c.items) G.stock[id] += c.items[id];
    G.stats.cost -= Object.keys(c.items).reduce((a, id) => a + ITEMS[id].cost * c.items[id], 0);
    leave(c, 'sad');
  }
}
function reportOOS() {
  const c = front(); if (!c || c.state !== 'order') return;
  let any = false;
  c.req.forEach(r => {
    if (r.oos) return;
    const avail = (G.stock[r.id] || 0) + (bag[r.id] || 0);
    if (avail < r.qty) { any = true; if (avail === 0) r.oos = true; else r.qty = avail; }
  });
  if (!any) { say(c, rpick(LINES.oosWrong)); c.patience -= 0.05; SFX.bad(); return; }
  G.stats.oos++; addRep(-0.03);
  if (c.req.every(r => r.oos)) { say(c, rpick(LINES.oosNone), 2.4); returnBag(); leave(c, 'sad'); }
  else { say(c, rpick(LINES.oosOk)); c.patience -= 0.04; }
  UI.refreshBar();
}
function remindDebt() {
  const c = front(); if (!c || !c.reg || c.remindDone) return;
  const d = G.debts[c.reg.name]; if (!d) return;
  c.remindDone = true;
  if (rnd() < c.reg.honesty * 0.8) {
    G.money += d.amt; G.stats.collected += d.amt; delete G.debts[c.reg.name];
    say(c, rpick(LINES.remindOk)); addFloat('+' + money(d.amt) + ' (trả nợ)', 520, 420, '#2e7d4a'); SFX.ching();
  } else { say(c, rpick(LINES.remindNo)); addRep(-0.03); c.patience -= 0.05; SFX.bad(); }
  UI.refreshBar();
}

function startDay(resume) {
  if (!(resume && G.minute > OPEN_MIN && G.minute < CLOSE_MIN && G.stats)) {
    G.minute = OPEN_MIN;
    G.stats = freshStats(); G.stats.startMoney = G.money;
  }
  customers = []; leavers = []; bag = {}; payCtx = null;
  spawnTimer = 3;
  phase = 'open'; paused = false;
  rebuildLayers();
  UI.refreshBar(); UI.updateHUD();
  UI.toast(`Ngày ${G.day} — ${G.weather === 'mua' ? '🌧️ Trời mưa, khách thưa, mì gói bán chạy' : '☀️ Trời nắng, nước uống bán chạy'}`);
}
// ============================================================
//  OFFLINE VẪN CÓ TIỀN — vắng mặt thì Cô Hoa bán giùm
// ============================================================
const OFFLINE_MIN_MS = 60 * 1000;     // vắng ít nhất 1 phút mới tính
const OFFLINE_MAX_H = 8;              // tính tối đa 8 tiếng
const OFFLINE_SALES_PER_H = 8;      // số món bán được mỗi giờ (ở uy tín 2.5)
let ITEM_POP = null;
function itemPopularity() {
  if (ITEM_POP) return ITEM_POP;
  ITEM_POP = {};
  for (const k in CUSTOMER_TYPES) { const w = CUSTOMER_TYPES[k].wants; for (const id in w) ITEM_POP[id] = (ITEM_POP[id] || 0) + w[id]; }
  return ITEM_POP;
}
function offlineEarn(ms) {
  if (!G || ms < OFFLINE_MIN_MS) return null;
  const hours = Math.min(ms / 3600000, OFFLINE_MAX_H);
  const rate = OFFLINE_SALES_PER_H * (0.5 + G.rep / 5) * (G.upgrades.bienhieu ? 1.1 : 1);
  let n = Math.floor(hours * rate + rnd());
  const pop = itemPopularity();
  const sold = {}; let earned = 0, count = 0, ranOut = false;
  for (let i = 0; i < n; i++) {
    const pool = Object.keys(ITEMS).filter(id => !isLocked(id) && G.stock[id] > 0);
    if (!pool.length) { ranOut = true; break; }
    const sum = pool.reduce((a, id) => a + (pop[id] || 1), 0);
    let r = rnd() * sum, pickId = pool[0];
    for (const id of pool) { r -= pop[id] || 1; if (r <= 0) { pickId = id; break; } }
    G.stock[pickId]--; sold[pickId] = (sold[pickId] || 0) + 1;
    earned += ITEMS[pickId].price; count++;
  }
  // khách nợ ghé trả
  const repaid = [];
  for (const name in G.debts) {
    const reg = REGULARS.find(r => r.name === name);
    if (reg && rnd() < reg.honesty * 0.35 * Math.min(1, hours / 3)) { repaid.push([name, G.debts[name].amt]); earned += G.debts[name].amt; delete G.debts[name]; }
  }
  G.money += earned;
  saveGame();
  return { ms, hours, count, earned, sold, ranOut, repaid, capped: ms / 3600000 > OFFLINE_MAX_H };
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (!G) return;
  if (document.hidden) {
    hiddenAt = Date.now(); saveGame();
    if (typeof MUSIC !== 'undefined') MUSIC.stop();
  } else {
    const away = hiddenAt ? Date.now() - hiddenAt : 0; hiddenAt = 0;
    if (phase !== 'menu') SFX.unlock();
    const res = offlineEarn(away);
    if (res) UI.showOffline(res, null);
  }
});
window.addEventListener('pagehide', saveGame);

function electricity() { return 15000 + (G.upgrades.quat ? 5000 : 0) + (G.upgrades.tulanh ? 10000 : 0); }
function endDay() {
  phase = 'summary'; paused = true;
  const elec = electricity();
  G.money -= elec;
  const summary = Object.assign({}, G.stats, { elec, endMoney: G.money, day: G.day });
  G.best = Math.max(G.best || 0, G.money);
  G.day++;
  G.weather = rnd() < 0.3 ? 'mua' : 'nang';
  saveGame();
  UI.showSummary(summary);
}
function buyUpgrade(id) {
  const u = UPGRADES.find(u => u.id === id);
  if (!u || G.upgrades[id] || G.money < u.price) return false;
  G.money -= u.price; G.upgrades[id] = true;
  for (const iid in ITEMS) if (ITEMS[iid].lock === id && G.stock[iid] === 0) G.stock[iid] = Math.ceil(ITEMS[iid].start / 2);
  if (id === 'bienhieu') addRep(0.5);
  rebuildLayers(); saveGame(); SFX.buy();
  return true;
}
function restock(id, qty) {
  qty = Math.min(qty, MAX_STOCK - G.stock[id]);
  const afford = Math.floor(G.money / ITEMS[id].cost);
  qty = Math.min(qty, afford);
  if (qty <= 0) return 0;
  G.money -= qty * ITEMS[id].cost; G.stock[id] += qty;
  SFX.pick();
  return qty;
}

// ============================================================
//  CẬP NHẬT
// ============================================================
function spawnInterval() {
  const hour = G.minute / 60;
  let hm = 1;
  if (hour < 8) hm = 1.5; else if (hour < 10) hm = 0.9; else if (hour < 11) hm = 0.85; else if (hour < 13) hm = 1.35;
  else if (hour < 15) hm = 0.65; else if (hour < 16) hm = 0.9; else if (hour < 19) hm = 1.55; else hm = 0.95;
  const repMul = 0.55 + G.rep * 0.17;
  const wMul = G.weather === 'mua' ? 0.75 : 1;
  const sMul = G.upgrades.bienhieu ? 1.1 : 1;
  return 42 / (hm * repMul * wMul * sMul) * (0.6 + rnd() * 0.8);
}

function update(dt) {
  t += dt;
  if (phase !== 'open' && phase !== 'closing') return;
  if (paused) return;
  const sdt = dt * speed;
  const gmin = sdt / SEC_PER_MIN;
  G.minute = Math.min(G.minute + gmin, 22 * 60);

  if (phase === 'open') {
    spawnTimer -= gmin;
    if (spawnTimer <= 0) { spawnCustomer(); spawnTimer = spawnInterval(); }
    if (G.minute >= CLOSE_MIN) { phase = 'closing'; UI.toast('🌙 9 giờ tối rồi — bán nốt khách cuối rồi đóng cửa'); }
  }

  const hour = G.minute / 60;
  const hot = G.weather === 'nang' && hour >= 11 && hour < 14.5 ? 1.2 : 1;
  const fan = G.upgrades.quat ? 0.75 : 1;
  customers.forEach((c, i) => {
    const T = CUSTOMER_TYPES[c.type];
    const tx = QUEUE_X[i];
    if (Math.abs(c.x - tx) > 2) { const far = 1 + clamp((tx - c.x - 150) / 250, 0, 2.5); c.walking = true; c.x += Math.sign(tx - c.x) * Math.min(Math.abs(tx - c.x), T.speed * far * sdt); c.phase += sdt * 9 * Math.min(far, 1.6); }
    else { c.walking = false; c.x = tx; if (i === 0 && c.state === 'queue') arrive(c); }
    let mult = (i === 0 ? 1 : (G.upgrades.banghe ? 0.3 : 0.5)) * hot * fan;
    if (c.state === 'pay' || c.state === 'credit') mult *= 0.5;
    c.patience -= sdt / T.patience * mult;
    if (c.patience <= 0) {
      if (c.state === 'pay' || c.state === 'credit') {
        c.patience = 0;
        if (!c.hurried) { c.hurried = true; say(c, rpick(LINES.hurry), 2.5); addRep(-0.05); }
      } else {
        say(c, rpick(LINES.angry), 2.6);
        if (c.state === 'order') returnBag();
        G.stats.angry++; addRep(-0.2); SFX.bad();
        leave(c, 'angry');
      }
    }
    c.mood = c.patience < 0.25 ? 'angry' : c.patience > 0.7 ? 'neutral' : 'neutral';
  });
  for (let i = leavers.length - 1; i >= 0; i--) {
    const c = leavers[i];
    if (c.leaveDelay > 0) { c.leaveDelay -= sdt; c.walking = false; continue; }
    c.walking = true; c.x -= CUSTOMER_TYPES[c.type].speed * (c.x < -150 ? 2.5 : 1.1) * sdt; c.phase += sdt * 9;
    if (c.x < -OX - 110) leavers.splice(i, 1);
  }
  if (phase === 'closing' && customers.length === 0 && leavers.length === 0) endDay();
}

function updateFx(dt) {
  floats.forEach(f => f.life += dt);
  floats = floats.filter(f => f.life < 1.6);
  flyers.forEach(f => f.p += dt * 4);
  flyers = flyers.filter(f => f.p < 1);
}

function render() {
  ctx.setTransform(PR, 0, 0, PR, OX * PR, 0);
  ctx.clearRect(-OX, 0, SW, VH);
  drawSky(ctx, G.minute, G.weather, t, OX);
  ctx.drawImage(backCv, -OX, 0, SW, VH);
  if (G.weather === 'mua') drawRain(ctx, t, OX);
  drawClockHands(ctx, G.minute);

  for (const id in SLOTS) { const s = SLOTS[id]; if (s.counter) continue; drawSlot(ctx, id, s, G.stock[id], isLocked(id), hover === id, t); }
  drawGlassOverlay(ctx);

  // Cô Hoa
  let pose = 'stand';
  const f = customers[0];
  if (hoa.until > t) pose = hoa.pose;
  else if (!f || f.state === 'queue') pose = 'fan';
  const hmood = hoa.until > t && (hoa.pose === 'wave') ? 'happy' : (!f ? 'happy' : 'neutral');
  drawChibi(ctx, HOA_X, HOA_FEET, LOOK_HOA, { t, pose, mood: hmood, talk: hoa.until > t && hoa.pose === 'wave' });

  ctx.drawImage(frontCv, -OX, 0, SW, VH);
  for (const id in SLOTS) { const s = SLOTS[id]; if (s.counter) drawSlot(ctx, id, s, G.stock[id], isLocked(id), hover === id, t); }
  drawSoNo(ctx, hover === '_sono');
  const calcText = calc.flashUntil > t ? calc.text : (payCtx ? (payCtx.total / 1000) + '.000' : (bagTotal() ? (bagTotal() / 1000) + '.000' : '0'));
  drawCalculator(ctx, calcText, calc.flashUntil > t);
  if (hover === '_calc') { ctx.save(); ctx.shadowColor = '#fff6a0'; ctx.shadowBlur = 10; rrPath(ctx, RECT_CALC.x - 3, RECT_CALC.y - 3, RECT_CALC.w + 6, RECT_CALC.h + 6, 5); fs(ctx, null, 3, '#ffcf33'); ctx.restore(); }
  drawBag(ctx, bag, t);
  if (G.upgrades.quat) drawFan(ctx, t);

  // khách
  const all = leavers.concat(customers.slice().reverse());
  all.forEach(c => {
    const leavingWave = c.state === 'leave' && c.leaveDelay > 0 && c.mood === 'happy';
    const pose = leavingWave ? 'wave' : c.state === 'pay' ? 'cash' : c.mood === 'angry' && !c.walking ? 'angry' : 'stand';
    const mood = c.state === 'leave' ? (c.mood === 'happy' ? 'happy' : c.mood === 'angry' ? 'angry' : 'neutral') : c.mood;
    const talk = c.sayUntil > t;
    const flip = c.state === 'leave' && c.walking;
    if (c.look.kid) drawChibi(ctx, c.x + (flip ? 34 : -34), CUST_FEET + 4, c.look.kid, { t, walking: c.walking, phase: c.phase + 1, mood: mood === 'angry' ? 'angry' : 'happy', pose: 'stand' });
    ctx.save();
    if (flip) { ctx.translate(c.x * 2, 0); ctx.scale(-1, 1); }
    drawChibi(ctx, c.x, CUST_FEET, c.look, { t, walking: c.walking, phase: c.phase, mood, pose, talk });
    ctx.restore();
  });

  // ánh sáng đêm
  const na = nightAmount(G.minute);
  if (na > 0) {
    ctx.fillStyle = `rgba(18,22,60,${na})`; ctx.fillRect(-OX, 0, SW, VH);
    drawBulbGlow(ctx, na);
  }

  // bong bóng thoại
  customers.forEach((c, i) => {
    const sc = (c.look.scale || 1);
    const headTop = CUST_FEET - 150 * sc;
    if (i === 0 && c.state !== 'queue') drawFrontBubble(c, headTop);
    else {
      drawMiniPatience(ctx, c.x, headTop - 12, clamp(c.patience, 0, 1));
      if (c.sayUntil > t) bubbleAt(c.x, headTop - 16, c.name, [{ text: c.say }], null);
    }
  });
  leavers.forEach(c => { if (c.sayUntil > t) bubbleAt(c.x, CUST_FEET - 150 * (c.look.scale || 1), c.name, [{ text: c.say, color: c.mood === 'angry' ? '#c0392b' : undefined }], null); });

  // hàng bay vào túi
  flyers.forEach(f => {
    const p = f.p, x = f.x0 + (f.x1 - f.x0) * p, y = f.y0 + (f.y1 - f.y0) * p - Math.sin(p * Math.PI) * 80;
    ctx.drawImage(ICONS[f.id], x - 16, y - 21, 32, 42);
  });
  floats.forEach(f => {
    ctx.save(); ctx.globalAlpha = 1 - Math.max(0, f.life - 1) / 0.6;
    txt(ctx, f.text, f.x, f.y - f.life * 30, 20, f.col, { stroke: '#fff', sw: 4 });
    ctx.restore();
  });

  // tooltip
  if (hover && ITEMS[hover]) {
    const it = ITEMS[hover];
    const lines = [it.name, isLocked(hover) ? '🔒 Cần nâng cấp: ' + UPGRADES.find(u => u.id === it.lock).name : `Giá ${money(it.price)} • Còn ${G.stock[hover]}`];
    drawTooltip(ctx, mouse.x, mouse.y, lines);
  } else if (hover === '_sono') drawTooltip(ctx, mouse.x, mouse.y, ['Sổ nợ', 'Xem ai đang nợ tiệm']);
  else if (hover === '_calc') drawTooltip(ctx, mouse.x, mouse.y, ['Máy tính', payCtx ? 'Bấm để tính tiền thối (khách chờ lâu hơn)' : 'Hiện tổng tiền']);

  if (phase === 'open' || phase === 'closing') { if (paused && !UI.modalOpen()) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-OX, 0, SW, VH); txt(ctx, 'TẠM DỪNG', SW / 2 - OX, VH / 2, 56, '#fff', { stroke: OUTLINE, sw: 6 }); } }
}

// bong bóng to hơn trên điện thoại
function bubbleAt(ax, ay, header, lines, patience, o = {}) {
  ctx.save();
  ctx.translate(ax, ay); ctx.scale(UIK, UIK); ctx.translate(-ax, -ay);
  o.minX = ax - (ax + OX - 6) / UIK;
  drawBubble(ctx, ax, ay, header, lines, patience, o);
  ctx.restore();
}
function reqText(r) {
  const it = ITEMS[r.id], nm = lower1(it.name);
  return nm.startsWith(it.unit + ' ') ? `${r.qty} ${nm}` : `${r.qty} ${it.unit} ${nm}`;
}
function drawFrontBubble(c, headTop) {
  const ax = c.x + 8, ay = headTop - 4;
  const talking = c.sayUntil > t;
  let header = talking ? c.say : `${c.name}: ${c.greet}...`;
  let lines = [];
  if (c.state === 'order') {
    lines = c.req.map(r => ({ icon: r.id, text: reqText(r), done: (bag[r.id] || 0) >= r.qty && !r.oos, oos: r.oos }));
  } else if (c.state === 'credit') {
    header = talking ? c.say : c.name + ':';
    lines = [{ text: c.creditLine }, { text: 'Tổng: ' + money(c.total), color: '#8a3a1a' }];
  } else if (c.state === 'pay' && payCtx) {
    header = talking ? c.say : c.name + ': Tiền nè cô!';
    lines = [{ text: 'Tổng: ' + money(payCtx.total) }, { text: 'Khách đưa: ' + money(payCtx.paid), color: '#2e7d4a' }];
  }
  bubbleAt(ax, ay, header, lines, clamp(c.patience, 0, 1), { headerColor: talking ? '#c0392b' : '#8a3a1a' });
}

//  INPUT
// ============================================================
function toLocal(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * SW / r.width - OX, y: (e.clientY - r.top) * VH / r.height };
}
function hitTest(x, y) {
  const inR = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  for (const id in SLOTS) if (inR(SLOTS[id])) return id;
  if (inR(RECT_SONO)) return '_sono';
  if (inR(RECT_CALC)) return '_calc';
  return null;
}
canvas.addEventListener('pointermove', e => {
  const p = toLocal(e); mouse = p;
  hover = phase === 'menu' ? null : hitTest(p.x, p.y);
  canvas.style.cursor = hover ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => { hover = null; });
canvas.addEventListener('pointerdown', e => {
  SFX.unlock();
  const p = toLocal(e); mouse = p;
  if (phase !== 'open' && phase !== 'closing') return;
  if (paused) return;
  const h = hitTest(p.x, p.y);
  if (!h) return;
  if (h === '_sono') UI.openDebtBook();
  else if (h === '_calc') calcHint();
  else clickSlot(h);
});
window.addEventListener('keydown', e => {
  if (e.key === ' ' && (phase === 'open' || phase === 'closing') && !UI.modalOpen()) { e.preventDefault(); togglePause(); }
  if (e.key === 'Enter' && !UI.modalOpen() && front() && front().state === 'order') handOver();
});
function togglePause() { paused = !paused; UI.updateHUD(); }

//  VÒNG LẶP
// ============================================================
let saveTimer = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  update(dt); updateFx(dt);
  saveTimer += dt;
  if (saveTimer > 5) { saveTimer = 0; if (phase !== 'menu') saveGame(); }
  if (typeof MUSIC !== 'undefined') MUSIC.setMood(nightAmount(G.minute) > 0.2, G.weather === 'mua');
  render();
  UI.tick();
  requestAnimationFrame(frame);
}

async function boot() {
  try { await Promise.race([document.fonts.load('bold 20px "Patrick Hand"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  buildIcons();
  const saved = loadGame();
  G = saved || newState();
  let rt = 0; const later = (ms = 80) => { clearTimeout(rt); rt = setTimeout(resize, ms); };
  window.addEventListener('resize', () => later());
  window.addEventListener('orientationchange', () => later(250));
  document.addEventListener('fullscreenchange', () => { later(120); UI.updateHUD(); });
  document.addEventListener('webkitfullscreenchange', () => later(120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => later(120));
  resize();
  UI.init();
  const away = saved && saved.lastSeen ? Date.now() - saved.lastSeen : 0;
  const res = saved ? offlineEarn(away) : null;
  if (res) UI.showOffline(res, () => UI.showMenu(true));
  else UI.showMenu(!!saved);
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
}
boot();

</script>
